# Status legend (see docs/VERSIONS.md):
#   [V] verified on 2026-09-28 against the official release page / GitHub release tag
#   [U] NOT verified - existed as a stable release in training data; bump to latest stable
[versions]
agp = "9.4.0"                   # [V] AGP 9.4.0 release notes, Sept 2026
kotlin = "2.4.20"               # [V] GitHub JetBrains/kotlin latest release
ksp = "2.3.12"                  # [V] GitHub google/ksp latest release
hilt = "2.60.1"                 # [V] GitHub google/dagger latest release
coreKtx = "1.19.1"              # [V] AndroidX stable channel, 2026-09-23
appcompat = "1.8.0"             # [V] AndroidX stable channel, 2026-08-12
activityCompose = "1.11.0"      # [U]
compose = "1.12.1"              # [V] compose.ui / foundation / runtime, 2026-09-09
material3 = "1.4.0"             # [V] compose.material3 stable
navigation = "2.10.2"           # [V] AndroidX stable channel, 2026-09-23
room = "2.8.5"                  # [V] AndroidX stable channel, 2026-09-09
sqlite = "2.7.1"                # [V] AndroidX stable channel, 2026-09-09
sqlcipher = "4.19.0"            # [V] GitHub sqlcipher/sqlcipher-android latest release
coroutines = "1.10.2"           # [U]
junit = "4.13.2"                # [U] (long-term stable, JUnit 4 line)
mediapipeGenai = "0.10.24"      # [U] MediaPipe LLM Inference (Google Maven); bump to the latest 0.10.x
androidxTestExtJunit = "1.3.0"  # [U]
androidxTestRunner = "1.7.0"    # [U]

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
compose-ui = { group = "androidx.compose.ui", name = "ui", version.ref = "compose" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview", version.ref = "compose" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling", version.ref = "compose" }
compose-foundation = { group = "androidx.compose.foundation", name = "foundation", version.ref = "compose" }
compose-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "material3" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation" }
room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
androidx-sqlite = { group = "androidx.sqlite", name = "sqlite", version.ref = "sqlite" }
sqlcipher-android = { group = "net.zetetic", name = "sqlcipher-android", version.ref = "sqlcipher" }
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-compiler", version.ref = "hilt" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
mediapipe-tasks-genai = { group = "com.google.mediapipe", name = "tasks-genai", version.ref = "mediapipeGenai" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestExtJunit" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxTestRunner" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
room = { id = "androidx.room", version.ref = "room" }
